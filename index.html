<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <title>Highway Racer 3D</title>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui">
    <canvas id="speedo" width="260" height="260"></canvas>
    <div id="stats">
      <div id="score">0</div>
      <div id="dist">0.0 km</div>
      <div id="coins">&#9678; 0</div>
      <div id="mult">x2 ONCOMING</div>
      <div id="health"><i></i></div>
      <div id="nitro"><i></i></div>
    </div>
    <div id="toast"></div>
    <div id="goal"></div>

    <div id="wheel">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" fill="rgba(0,0,0,.25)"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="#1b1b1b" stroke-width="12"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <path d="M50 50 L13 62 M50 50 L87 62 M50 50 L50 88" stroke="#1b1b1b" stroke-width="9" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="9" fill="#1b1b1b"/>
        <rect x="47" y="8" width="6" height="10" rx="2" fill="#19b5ff"/>
      </svg>
    </div>

    <div id="pedals">
      <button id="nitroBtn" class="pedal round" aria-label="Nitro">N2O</button>
      <button id="brake" class="pedal" aria-label="Brake"></button>
      <button id="gas" class="pedal" aria-label="Accelerator"></button>
    </div>
  </div>

  <div id="flash"></div>
  <div id="lines"></div>
  <div id="btns">
    <button id="muteBtn" title="Sound">&#128266;</button>
    <button id="musicBtn" title="Music">&#9835;</button>
    <button id="todBtn" title="Time of day">&#9728;</button>
    <button id="qualBtn" title="Graphics quality">HIGH</button>
    <button id="pauseBtn" title="Pause game" aria-label="Pause game">Ⅱ</button>
    <button id="immersiveBtn" title="Fullscreen and landscape" aria-label="Fullscreen and landscape">⛶</button>
  </div>

  <div id="coinBal">&#9678; 0</div>

  <div id="overlay">
    <h1 id="title">HIGHWAY RACER 3D</h1>
    <p id="msg"></p>
    <div id="menuBox">
    <div id="modes" class="tabs"></div>
    <div id="modeInfo"></div>
    <div id="missionPick" class="carrow hidden">
      <button id="prevM" class="arrow">&#8249;</button>
      <div class="mcenter"><div id="missionName"></div><div id="missionDesc"></div></div>
      <button id="nextM" class="arrow">&#8250;</button>
    </div>
    <button id="twoWayBtn" class="chip">TWO-WAY ROAD: OFF</button>
    <div id="garage">
      <div class="carrow"><button id="prevCar" class="arrow">&#8249;</button><div id="carName">STRIKER</div><button id="nextCar" class="arrow">&#8250;</button></div>
      <div class="bars">
        <div class="bar"><span>SPEED</span><b><i id="bSpeed"></i></b></div>
        <div class="bar"><span>ACCEL</span><b><i id="bAcc"></i></b></div>
        <div class="bar"><span>HANDLING</span><b><i id="bHnd"></i></b></div>
      </div>
      <div id="swatches"></div>
    </div>
    </div>
    <div class="row">
      <button id="garageBtn" class="ghost hidden">MENU</button>
      <button id="shopBtn" class="ghost">SHOP</button>
      <button id="leaderboardBtn" class="ghost">LEADERBOARD</button>
      <button id="shareBtn" class="ghost hidden">SHARE SCORE</button>
      <button id="start">START</button>
    </div>
  </div>

  <div id="pauseOverlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
    <div class="panel">
      <h1 id="pauseTitle">PAUSED</h1>
      <p>Your race is paused.</p>
      <div class="actions">
        <button id="resumeBtn">RESUME</button>
        <button id="restartBtn" class="ghost">RESTART</button>
        <button id="pauseMenuBtn" class="ghost">MAIN MENU</button>
      </div>
    </div>
  </div>

  <div id="leaderboard" class="hidden" role="dialog" aria-modal="true" aria-labelledby="leaderTitle">
    <div class="panel leaderboard-panel">
      <h1 id="leaderTitle">LEADERBOARD</h1>
      <div class="leader-tools">
        <input id="playerName" maxlength="18" autocomplete="nickname" aria-label="Player name" placeholder="Your racer name" />
        <select id="leaderMode" aria-label="Leaderboard mode">
          <option value="endless">ENDLESS</option>
          <option value="time">TIME ATTACK</option>
          <option value="missions">MISSIONS</option>
        </select>
      </div>
      <div id="leaderStatus">Local scores on this device</div>
      <ol id="leaderRows"></ol>
      <div class="actions">
        <button id="syncScoreBtn" class="ghost">SYNC SCORE</button>
        <button id="leaderBackBtn">BACK</button>
      </div>
    </div>
  </div>

  <div id="shop" class="hidden">
    <h1>UPGRADES</h1>
    <div id="shopCar"></div>
    <div id="shopCoins"></div>
    <div id="shopRows"></div>
    <button id="shopBack" class="ghost">BACK</button>
  </div>

  <script src="./leaderboard-config.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
