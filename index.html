<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Highway Racer 3D</title>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui">
    <canvas id="speedo" width="260" height="260"></canvas>
    <div id="stats">
      <div id="score">0</div>
      <div id="dist">0.0 km</div>
      <div id="coins">&#9678; 0</div>
      <div id="mult">x2 ONCOMING</div>
      <div id="health"><i></i></div>
      <div id="nitro"><i></i></div>
    </div>
    <div id="toast"></div>
    <div id="goal"></div>

    <div id="wheel">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" fill="rgba(0,0,0,.25)"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="#1b1b1b" stroke-width="12"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <path d="M50 50 L13 62 M50 50 L87 62 M50 50 L50 88" stroke="#1b1b1b" stroke-width="9" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="9" fill="#1b1b1b"/>
        <rect x="47" y="8" width="6" height="10" rx="2" fill="#19b5ff"/>
      </svg>
    </div>

    <div id="pedals">
      <button id="nitroBtn" class="pedal round" aria-label="Nitro">N2O</button>
      <button id="brake" class="pedal" aria-label="Brake"></button>
      <button id="gas" class="pedal" aria-label="Accelerator"></button>
    </div>
  </div>

  <div id="flash"></div>
  <div id="lines"></div>
  <div id="btns">
    <button id="muteBtn" title="Sound">&#128266;</button>
    <button id="musicBtn" title="Music">&#9835;</button>
    <button id="todBtn" title="Time of day">&#9728;</button>
    <button id="qualBtn" title="Graphics quality">HIGH</button>
  </div>

  <div id="overlay">
    <header id="mhead">
      <div class="brand">
        <div class="logo">HR<b>3D</b></div>
        <div class="brandtxt"><strong>HIGHWAY RACER</strong><span>DRIVE YOUR LIMIT</span></div>
      </div>
      <div id="coinBal" class="pill">&#9678; 0</div>
    </header>

    <section id="result">
      <span class="eyebrow">RUN SUMMARY</span>
      <h1 id="title">HIGHWAY RACER 3D</h1>
      <p id="msg"></p>
    </section>

    <div id="menuBox">
      <main id="panel">
        <!-- RACE -->
        <div class="view" data-v="race">
          <button class="vehicle" data-tab="garage">
            <span><small>CURRENT VEHICLE</small><b id="carChip">STRIKER</b></span>
            <em>CUSTOMISE <i>&#8250;</i></em>
          </button>
          <div class="eyebrow">GAME MODE</div>
          <div id="modes" class="modes"></div>
          <div id="modeInfo"></div>
          <div id="missionPick" class="mpick hidden">
            <button id="prevM" class="arrow">&#8249;</button>
            <div class="mcenter"><div id="missionName"></div><div id="missionDesc"></div></div>
            <button id="nextM" class="arrow">&#8250;</button>
          </div>
          <button id="twoWayBtn" class="toggle" role="switch" aria-checked="false">
            <span class="tl">TWO-WAY ROAD<small>Oncoming traffic &middot; x2 score on that side</small></span>
            <span class="knob"></span>
          </button>
        </div>

        <!-- GARAGE -->
        <div class="view" data-v="garage">
          <div class="eyebrow">VEHICLE <span id="carCount"></span></div>
          <div id="garage">
            <div class="carrow">
              <button id="prevCar" class="arrow">&#8249;</button>
              <div id="carName">STRIKER</div>
              <button id="nextCar" class="arrow">&#8250;</button>
            </div>
            <div class="bars">
              <div class="bar"><span>SPEED</span><b><i id="bSpeed"></i></b></div>
              <div class="bar"><span>ACCEL</span><b><i id="bAcc"></i></b></div>
              <div class="bar"><span>HANDLING</span><b><i id="bHnd"></i></b></div>
            </div>
            <div class="eyebrow">PAINT</div>
            <div id="swatches"></div>
          </div>
        </div>

        <!-- UPGRADES -->
        <div class="view" data-v="upgrades">
          <div class="shophead">
            <div><div class="eyebrow">UPGRADING</div><div id="shopCar"></div></div>
            <div id="shopCoins" class="pill"></div>
          </div>
          <div id="shopRows"></div>
        </div>

        <!-- RECORDS -->
        <div class="view" data-v="records">
          <div class="eyebrow">PERSONAL BEST</div>
          <div id="records"></div>
        </div>
      </main>

      <nav id="mnav">
        <button data-tab="race"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>RACE</span></button>
        <button data-tab="garage"><svg viewBox="0 0 24 24"><path d="M3 17v-4l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v4h-3M3 17h2M19 17h2M8 17h8M3 13h18"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/></svg><span>GARAGE</span></button>
        <button data-tab="upgrades"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span>UPGRADES</span></button>
        <button data-tab="records"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg><span>RECORDS</span></button>
      </nav>
    </div>

    <div id="playBar">
      <button id="garageBtn" class="btn ghost hidden">MENU</button>
      <button id="start" class="btn play">PLAY</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
