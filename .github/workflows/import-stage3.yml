name: Import Highway Racer 3D Stage 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-stage3.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  import-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract Stage 3 into project root
        run: |
          mkdir -p /tmp/stage3
          unzip -q highway-racer-3d-stage3/highway-racer-3d-stage3.zip -d /tmp/stage3
          rsync -a --exclude='.github/workflows/deploy.yml' /tmp/stage3/highway-racer-3d/ ./
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and build
        run: |
          npm install
          npm run build
      - name: Commit imported Stage 3 files
        run: |
          rm -f .github/workflows/import-stage3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Highway Racer 3D Stage 3"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
