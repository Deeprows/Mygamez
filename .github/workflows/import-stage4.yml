name: Import Stage 4
on:
  push:
    paths:
      - ".stage4-import-trigger"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import Stage 4 files
        run: |
          mkdir -p /tmp/stage4
          unzip -o highway-racer-3d-stage4/Mygamez-stage4-changes.zip -d /tmp/stage4
          rsync -a /tmp/stage4/ ./ --exclude='.git/' --exclude='.github/'
          test -f package.json
          npm install
          npm run build
      - name: Commit imported files
        run: |
          rm -f .stage4-import-trigger .github/workflows/import-stage4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Highway Racer 3D Stage 4"
          git push
